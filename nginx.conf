server {
    listen 80;
    server_name localhost;

    # 1. Servir los archivos estáticos de Angular (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirige cualquier ruta no encontrada a index.html
        # (Necesario para que funcione el Router de Angular)
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso para la API
    # Cuando Angular llame a /api/..., Nginx lo enviará al backend
    location /api/ {
        # 'peludos_api' es el nombre del contenedor de tu backend en docker-compose
        proxy_pass http://peludos_api:8000/; 
        
        # Quitamos el prefijo /api antes de enviarlo al backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}